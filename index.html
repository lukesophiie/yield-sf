<title>Yield SF</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: the map is the app. Floating rounded cards over it, one loud orange button, a sheet that slides between states. */
:root{
  --water:#b9e1f4; --land2:#e4e8dc; --land:#fcfdfb; --hill:#eef1e3; --fwy:#f1cd78; --sand:#eadfbd; --park:#cbe7c4; --road:#ffffff; --road2:#d5dce4; --label:#6a7686;
  --pdr:#19b86a; --hin:#ff6b4a;
  --card:#ffffff; --ink:#18223a; --dim:#5d6980; --line:#e1e6ee; --soft:#f2f5f9;
  --go:#ff6a1a; --go-ink:#ffffff; --ok:#0f9d58; --ok-bg:#dcf5e7; --bad:#e2343a; --bad-bg:#fde4e4; --warn:#b97a00; --warn-bg:#fff1cc; --link:#2057d6;
  --font:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --shadow:0 6px 24px rgba(20,30,60,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --water:#0e2738; --land2:#14202b; --land:#222c38; --hill:#1e2a2b; --fwy:#6d5a2a; --sand:#3b3626; --park:#1d3a2a; --road:#33404e; --road2:#27323e; --label:#93a0b3;
  --pdr:#2bd683; --hin:#ff7d5f;
  --card:#1a2230; --ink:#eef2f8; --dim:#9daabd; --line:#2d3748; --soft:#232d3c;
  --go:#ff7a2e; --go-ink:#1a1206; --ok:#4fd695; --ok-bg:#143524; --bad:#ff7b7f; --bad-bg:#3d1a1c; --warn:#f3c552; --warn-bg:#3a2e0c; --link:#8db4ff;
  --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --water:#0e2738; --land2:#14202b; --land:#222c38; --hill:#1e2a2b; --fwy:#6d5a2a; --sand:#3b3626; --park:#1d3a2a; --road:#33404e; --road2:#27323e; --label:#93a0b3;
  --pdr:#2bd683; --hin:#ff7d5f;
  --card:#1a2230; --ink:#eef2f8; --dim:#9daabd; --line:#2d3748; --soft:#232d3c;
  --go:#ff7a2e; --go-ink:#1a1206; --ok:#4fd695; --ok-bg:#143524; --bad:#ff7b7f; --bad-bg:#3d1a1c; --warn:#f3c552; --warn-bg:#3a2e0c; --link:#8db4ff;
  --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
.app{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.app pre,.app input{-webkit-user-select:text;user-select:text}
#map *{-webkit-user-select:none;user-select:none}
#map:focus,.pin:focus{outline:none}
.pin:focus-visible .body{filter:drop-shadow(0 0 4px var(--link))}
html,body{height:100%}
body{background:var(--water);color:var(--ink);font:600 15px/1.45 var(--font);overflow:hidden}
.app{position:relative;height:100%;min-height:560px;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block;background:var(--water)}
#map.placing{cursor:crosshair}
.lbl{font-family:var(--font);font-weight:800;fill:var(--label);text-anchor:middle;letter-spacing:.06em;text-transform:uppercase;pointer-events:none}
.sl{font-family:var(--font);font-weight:800;fill:var(--label);letter-spacing:.05em;pointer-events:none}
.st{font-family:var(--font);font-weight:800;fill:var(--dim);pointer-events:none}
.pin{cursor:pointer}
.pin .ring{fill:none;stroke-width:3;opacity:0;transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:no-preference){
  .pin.new .ring{animation:ring 1.6s ease-out infinite}
  .pin.drop .body{animation:drop .5s cubic-bezier(.2,1.6,.4,1)}
  .fab{animation:pulse 2.4s ease-in-out infinite}
  .sheet{animation:up .28s cubic-bezier(.2,.9,.3,1)}
  .toast{animation:toast 2.2s ease forwards}
}
@keyframes ring{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
@keyframes drop{0%{transform:translateY(-60px);opacity:0}100%{transform:none;opacity:1}}
@keyframes pulse{0%,100%{box-shadow:0 8px 24px rgba(255,106,26,.45),0 0 0 0 rgba(255,106,26,.5)}50%{box-shadow:0 8px 24px rgba(255,106,26,.45),0 0 0 16px rgba(255,106,26,0)}}
@keyframes up{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
@keyframes toast{0%{transform:translate(-50%,10px);opacity:0}12%,80%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-10px);opacity:0}}
.top{position:absolute;top:12px;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:18px;padding:8px 16px 8px 10px;box-shadow:var(--shadow)}
.brand svg{width:38px;height:38px;flex:none}
.brand b{font-weight:900;font-size:1.35rem;letter-spacing:-.02em;line-height:1}
.brand span{display:block;font-size:.72rem;color:var(--dim);line-height:1.1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;justify-content:flex-end}
.chip{font:800 .8rem var(--font);background:var(--card);color:var(--ink);border:2px solid transparent;border-radius:99px;padding:7px 12px;box-shadow:var(--shadow);cursor:pointer;display:flex;gap:6px;align-items:center}
.chip i{width:14px;height:14px;border-radius:4px;display:inline-block}
.chip[aria-pressed="false"]{opacity:.6}
.chip.stat{cursor:default}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.zoom{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:grid;gap:6px}
.zoom button{width:42px;height:42px;border-radius:14px;border:0;background:var(--card);color:var(--ink);font:900 1.3rem var(--font);box-shadow:var(--shadow);cursor:pointer}
.fab{position:absolute;right:max(20px,env(safe-area-inset-right,0px));bottom:24px;width:84px;height:84px;border-radius:50%;border:0;background:var(--go);color:var(--go-ink);font:900 .78rem var(--font);cursor:pointer;display:grid;place-items:center;line-height:1.05}
.fab svg{width:34px;height:34px;display:block;margin:0 auto 1px}
.sheet{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:84px;width:384px;max-height:calc(100% - 100px);overflow:auto;background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:16px;display:grid;gap:12px;align-content:start}
@media (max-width:820px){
  .sheet{top:auto;bottom:0;left:0;right:0;width:auto;max-height:64%;border-radius:22px 22px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .fab{display:none}
  .zoom{top:132px;transform:none}
  .sheet[data-mode=idle],.sheet[data-mode=placing]{max-height:46%}
  .chip{font-size:.72rem;padding:6px 10px}
  .brand span{display:none}
}
h2{font:900 1.3rem/1.15 var(--font);margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font:800 .72rem var(--font);text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:0}
p{margin:0}
.dim{color:var(--dim);font-size:.88rem}
.big{font:900 1rem var(--font);border:0;border-radius:16px;padding:14px 16px;background:var(--go);color:var(--go-ink);cursor:pointer;width:100%}
.big:disabled{opacity:.5;cursor:default}
.btn{font:800 .88rem var(--font);border:2px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--card);color:var(--ink);cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .btn{flex:1}
.x{margin-left:auto;width:34px;height:34px;border-radius:50%;border:0;background:var(--soft);color:var(--ink);font:900 1rem var(--font);cursor:pointer;flex:none}
.head{display:flex;gap:10px;align-items:flex-start}
.legend{display:grid;gap:8px}
.legend div{display:flex;gap:10px;align-items:center;font-size:.9rem}
.sw{width:26px;height:16px;border-radius:5px;flex:none}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{border:2px solid var(--line);background:var(--soft);color:var(--ink);border-radius:18px;padding:10px 4px 8px;cursor:pointer;display:grid;gap:2px;justify-items:center;font:800 .76rem/1.15 var(--font);text-align:center}
.tile span{font-size:1.7rem;line-height:1.1}
.tile small{font:500 .6rem var(--mono);color:var(--dim)}
.tile[aria-pressed="true"]{border-color:var(--bad);background:var(--bad-bg)}
.loc{display:grid;gap:6px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:.88rem;padding:8px 10px;border-radius:12px}
.chk.bad{background:var(--bad-bg)} .chk.ok{background:var(--ok-bg)} .chk.unk{background:var(--warn-bg)}
.chk b{font-weight:900}
.cite{font:500 .72rem var(--mono);color:var(--link);text-decoration:none;white-space:nowrap}
.cite:hover{text-decoration:underline}
.verdict{border-radius:16px;padding:12px 14px;font:900 1.25rem/1.15 var(--font)}
.verdict.bad{background:var(--bad);color:var(--card)} .verdict.ok{background:var(--ok);color:var(--card)}
.verdict small{display:block;font:800 .8rem var(--font);opacity:.9;margin-top:2px}
ul.v{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ul.v li{display:grid;gap:0;border-left:4px solid var(--bad);padding:2px 0 2px 10px;font-size:.9rem}
ul.v li b{font-weight:900}
.feed{display:grid;gap:6px}
.item{display:flex;gap:10px;align-items:center;border:0;background:var(--soft);color:var(--ink);border-radius:14px;padding:9px 12px;cursor:pointer;text-align:left;font:600 .88rem var(--font);width:100%}
.item .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--card);font-weight:900;flex:none}
.item b{font-weight:900;display:block}
.tag{font:500 .62rem var(--mono);text-transform:uppercase;letter-spacing:.06em;background:var(--warn-bg);color:var(--warn);padding:2px 6px;border-radius:5px;margin-left:6px;vertical-align:middle}
input.note{font:600 .92rem var(--font);width:100%;padding:11px 12px;border-radius:14px;border:2px solid var(--line);background:var(--soft);color:var(--ink)}
pre{font:500 .72rem/1.5 var(--mono);background:var(--soft);border-radius:12px;padding:10px;margin:0;white-space:pre-wrap;overflow-wrap:anywhere;max-height:150px;overflow:auto}
details{font-size:.86rem;color:var(--dim)}
details summary{cursor:pointer;font-weight:800;color:var(--ink)}
details ul{margin:6px 0 0;padding-left:18px;display:grid;gap:4px}
.rule{display:grid;gap:1px;padding:8px 0;border-top:1px solid var(--line);font-size:.88rem}
.rule b{font-weight:900}
.banner{position:absolute;left:50%;top:84px;transform:translateX(-50%);background:var(--ink);color:var(--card);border-radius:99px;padding:10px 18px;font-weight:800;box-shadow:var(--shadow);white-space:nowrap}
.toast{position:absolute;left:50%;top:40%;background:var(--ok);color:var(--card);font:900 1.3rem var(--font);border-radius:99px;padding:12px 22px;box-shadow:var(--shadow);pointer-events:none;white-space:nowrap}

.modal{position:absolute;inset:0;background:rgba(10,16,30,.55);display:grid;place-items:center;padding:16px;z-index:5}
.mcard{background:var(--card);border-radius:24px;box-shadow:var(--shadow);width:min(1240px,100%);max-height:100%;overflow:auto;padding:22px;display:grid;gap:16px}
.mcard h2{font-size:1.7rem}
.cols3{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.cols3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.cols3{grid-template-columns:minmax(0,1fr)}}
.col{background:var(--soft);border-radius:18px;padding:14px;display:grid;gap:10px;align-content:start}
.col h3{color:var(--ink);font-size:.82rem}
.col ul{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:.9rem}
.col li{display:grid;gap:1px}
.step{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start;font-size:.9rem}
.step i{width:34px;height:34px;border-radius:50%;background:var(--go);color:var(--go-ink);display:grid;place-items:center;font:900 1rem var(--font);font-style:normal}
.step b,.col li b{font-weight:900}
.pts{font:500 .72rem var(--mono);color:var(--ok)} .pts.neg{color:var(--bad)}
.vote[aria-pressed="true"]{border-color:var(--ink);background:var(--soft)}
.live{font:800 .72rem var(--font);color:var(--dim);display:flex;gap:6px;align-items:center}
.live i{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.live.on i{background:var(--ok)}
</style>

<div class="app" id="app">
<svg id="map" role="application" aria-label="Map of San Francisco. Tap to place a robot sighting.">
  <defs>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="var(--pdr)" opacity=".28"/><rect width="4" height="10" fill="var(--pdr)" opacity=".45"/></pattern>
    <pattern id="gA" width="13" height="10" patternUnits="userSpaceOnUse"><path d="M0 .5H13M.5 0V10" stroke="var(--road2)" stroke-width="1.1" fill="none"/></pattern>
    <pattern id="gW" width="9" height="17" patternUnits="userSpaceOnUse"><path d="M0 .5H9M.5 0V17" stroke="var(--road2)" stroke-width="1.1" fill="none"/></pattern>
    <pattern id="gS" width="17" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-44)"><path d="M0 .5H17M.5 0V9" stroke="var(--road2)" stroke-width="1.1" fill="none"/></pattern>
    <pattern id="gX" width="12" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(27)"><path d="M0 .5H12M.5 0V10" stroke="var(--road2)" stroke-width="1.1" fill="none"/></pattern>
    <symbol id="bot" viewBox="0 0 40 40"><rect x="8" y="12" width="24" height="18" rx="6" fill="#fff"/><rect x="18.5" y="5" width="3" height="8" rx="1.5" fill="#fff"/><circle cx="20" cy="5" r="3" fill="#fff"/><circle cx="15" cy="20" r="2.6" fill="#18223a"/><circle cx="25" cy="20" r="2.6" fill="#18223a"/><circle cx="13" cy="32" r="3.4" fill="#fff"/><circle cx="27" cy="32" r="3.4" fill="#fff"/></symbol>
  </defs>
  <g id="base"></g><g id="zones"></g><g id="hin"></g><g id="labels"></g><g id="stl"></g><g id="pins"></g>
</svg>

<div class="top">
  <div class="brand">
    <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="13" fill="var(--go)"/><use href="#bot"/></svg>
    <div><b>Yield</b><span>the sidewalk robot map of SF</span></div>
  </div>
  <div class="chips">
    <button class="chip" id="lyPdr" aria-pressed="true" type="button"><i style="background:var(--pdr)"></i>Robot-legal zones</button>
    <button class="chip" id="lyHin" aria-pressed="true" type="button"><i style="background:var(--hin)"></i>High-injury streets</button>
    <button class="chip" id="how" type="button" style="background:var(--ink);color:var(--card)">How it works</button>
    <span class="chip stat" id="stat"></span>
  </div>
</div>
<div class="zoom"><button type="button" id="zin" aria-label="Zoom in">+</button><button type="button" id="zout" aria-label="Zoom out">−</button></div>
<div class="banner" id="banner" hidden>Tap the map where you saw the robot</div>
<button class="fab" id="fab" type="button" aria-label="Report a robot"><span><svg viewBox="0 0 40 40" aria-hidden="true"><use href="#bot"/></svg>REPORT</span></button>
<div class="sheet" id="sheet"></div>
<div class="modal" id="modal" hidden></div>
</div>

<script>
const D = {"source": "San Francisco Public Works Code Sec. 794, Autonomous Delivery Devices", "source_url": "https://codelibrary.amlegal.com/codes/san_francisco/latest/sf_publicworks/0-0-0-48516", "definition": "A motorized device that carries items on City sidewalks for commercial purposes, guided or controlled without a person sitting or standing on it and steering it.", "rules": [{"clause": "794(a)", "who": "resident", "title": "Sidewalks only", "text": "The permit program covers City sidewalks. Streets and highways under SFMTA jurisdiction are outside it.", "check": {"field": "on_sidewalk", "op": "==", "value": true}, "id": "R01"}, {"clause": "794(i)(4)(A)", "who": "resident", "title": "PDR zoning only", "text": "Testing is limited to sidewalks in PDR (Production, Distribution, Repair) zoning districts.", "check": {"field": "zoning_pdr", "op": "==", "value": true}, "id": "R02"}, {"clause": "794(i)(4)(B)", "who": "resident", "title": "Not on a high-injury corridor", "text": "No testing on sidewalks along Vision Zero high-injury corridors.", "check": {"field": "high_injury_corridor", "op": "==", "value": false}, "id": "R03"}, {"clause": "794(i)(4)(C)", "who": "resident", "title": "Room for people with disabilities", "text": "The sidewalk must keep a path of travel for people with disabilities, or have an effective width of at least 6 feet.", "check": {"any": [{"field": "clear_width_ft", "op": ">=", "value": 6}, {"field": "accessible_path", "op": "==", "value": true}]}, "id": "R04"}, {"clause": "794(i)(1)", "who": "resident", "title": "3 mph speed limit", "text": "A device may not go faster than 3 miles per hour.", "check": {"field": "speed_mph", "op": "<=", "value": 3}, "id": "R05"}, {"clause": "794(i)(2)", "who": "resident", "title": "Human operator within 30 feet", "text": "A human operator must stay within 30 feet of the device for the whole test.", "check": {"field": "operator_distance_ft", "op": "<=", "value": 30}, "id": "R06"}, {"clause": "794(i)(3)", "who": /* ---------- shared sightings (lights up when the viewer can use the store) ---------- */
(async()=>{
  const db=await (window.claude?.use?.("db")??null);if(!db)return;
  try{const user=await window.claude.use("user"),id=user&&await user.id();if(id){ME=id;voteDoc=db.doc("votes/"+id);
    db.collection("votes").limit(500).onSnapshot(s=>{remoteVotes={};for(const d of s.docs){const v=(d.data()||{}).v;if(v&&typeof v==="object")remoteVotes[d.id]=v}if(S.mode==="idle"||S.mode==="card")render()},()=>{});
    if(Object.keys(myVotes).length)pushVotes();render()}}catch(e){}
  dbRef=db.collection("reports");
  dbRef.orderBy("t","desc").limit(200).onSnapshot(s=>{
    shared=s.docs.map(d=>{const v=d.data()||{};return {id:d.id,x:+v.x,y:+v.y,tiles:Array.isArray(v.tiles)?v.tiles.filter(t=>TMAP[t]).slice(0,12):[],note:typeof v.note==="string"?v.note.slice(0,200):"",t:+v.t||Date.now(),by:typeof v.by==="string"?v.by.slice(0,40):"anon"}}).filter(r=>r.x>-50&&r.x<1300&&r.y>-50&&r.y<1100);
    live=true;if(S.mode==="idle")render();else{SC=score();drawPins()}
  },()=>{live=false});
})();
</script>
